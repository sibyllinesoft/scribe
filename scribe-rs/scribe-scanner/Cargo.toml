[package]
name = "scribe-scanner"
version = "0.5.0"
edition = "2021"
authors = ["Nathan Rice <nathan@sibylline.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sibyllinesoft/scribe"
homepage = "https://github.com/sibyllinesoft/scribe"
documentation = "https://docs.rs/scribe-scanner"
keywords = ["code-analysis", "ast", "repository", "documentation", "developer-tools"]
categories = ["development-tools", "text-processing", "parsing"]
description = "High-performance file system scanning and indexing for Scribe"

[dependencies]
# Local dependencies
scribe-core = { version = "0.5.0", path = "../scribe-core" }
scribe-selection = { version = "0.5.0", path = "../scribe-selection" }

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"

# File system scanning
walkdir = "2.4"
ignore = "0.4"
globset = "0.4"

# String processing and pattern matching (needed for markdown parsing)
regex = "1.10"

# Async processing
async-trait = "0.1"
futures = "0.3"

# Data structures
indexmap = "2.0"
dashmap = "5.5"

# Performance
once_cell = "1.19"
parking_lot = "0.12"
memchr = "2.6"
string-interner = "0.17"
fxhash = "0.2.1"
bincode = "1.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
git2 = "0.18"
aho-corasick.workspace = true

# AST parsing with tree-sitter
tree-sitter = "0.20"
tree-sitter-python = "0.20.4"
tree-sitter-javascript = "0.20.2"
tree-sitter-typescript = "0.20.3"
tree-sitter-go = "0.20.0" 
tree-sitter-rust = "0.20.4"

# Logging
log = "0.4"
num_cpus = "1.16"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

