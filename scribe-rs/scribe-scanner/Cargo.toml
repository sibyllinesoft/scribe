[package]
name = "scribe-scanner"
version = "0.5.0"
edition = "2021"
authors = ["Nathan Rice <nathan@sibylline.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sibyllinesoft/scribe"
homepage = "https://github.com/sibyllinesoft/scribe"
documentation = "https://docs.rs/scribe-scanner"
keywords = ["code-analysis", "ast", "repository", "documentation", "developer-tools"]
categories = ["development-tools", "text-processing", "parsing"]
description = "High-performance file system scanning and indexing for Scribe"

[dependencies]
# Local dependencies
scribe-core = { version = "0.5.0", path = "../scribe-core" }
scribe-selection = { version = "0.5.0", path = "../scribe-selection" }

# Core dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
rayon = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# File system scanning
walkdir = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }

# String processing and pattern matching (needed for markdown parsing)
regex = { workspace = true }

# Async processing
async-trait = { workspace = true }
futures = { workspace = true }

# Data structures
indexmap = { workspace = true }
dashmap = { workspace = true }

# Performance
once_cell = { workspace = true }
parking_lot = { workspace = true }
memchr = { workspace = true }
string-interner = "0.17"
fxhash = "0.2.1"
bincode = "1.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
git2 = "0.18"
aho-corasick.workspace = true

# AST parsing with tree-sitter
tree-sitter = "0.20"
tree-sitter-python = "0.20.4"
tree-sitter-javascript = "0.20.2"
tree-sitter-typescript = "0.20.3"
tree-sitter-go = "0.20.0" 
tree-sitter-rust = "0.20.4"

# Logging
log = { workspace = true }
num_cpus = "1.16"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
