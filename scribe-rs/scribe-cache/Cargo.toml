[package]
name = "scribe-cache"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistent caching layer for scribe computations"
keywords = ["cache", "persistence", "hash", "incremental"]
categories = ["caching", "development-tools"]

[dependencies]
# Storage
redb = "2.1"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3"

# Concurrency
dashmap = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = "0.1"

# Platform directories
dirs = "5.0"

# Git integration (for repo identification)
git2 = { version = "0.18", features = ["vendored-openssl"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = { workspace = true }

[features]
default = ["git"]
git = ["dep:git2"]
