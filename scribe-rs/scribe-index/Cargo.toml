[package]
name = "scribe-index"
version.workspace = true
edition.workspace = true
description = "Full-text search index for scribe with BM25 ranking"

[dependencies]
# Full-text search
tantivy = "0.22"

# Caching integration
scribe-cache = { path = "../scribe-cache" }

# Serialization
serde = { workspace = true }
bincode = "1.3"

# Concurrency
rayon = { workspace = true }
parking_lot = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = "0.1"

# Filesystem
dirs = "5.0"

[dev-dependencies]
tempfile = "3"
