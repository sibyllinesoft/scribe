[package]
name = "scribe-analysis"
version = "1.0.0"
edition = "2021"
authors = ["Nathan Rice <nathan@sibylline.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sibyllinesoft/scribe"
homepage = "https://github.com/sibyllinesoft/scribe"
documentation = "https://docs.rs/scribe-analysis"
keywords = ["code-analysis", "ast", "repository", "documentation", "developer-tools"]
categories = ["development-tools", "text-processing", "parsing"]
description = "Code analysis algorithms and AST processing for Scribe"

[features]
default = ["tree-sitter"]
tree-sitter = []

[dependencies]
# Local dependencies
scribe-core = { version = "1.0.0", path = "../scribe-core" }

# Core dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
rayon = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# AST and parsing
tree-sitter = "0.20"
tree-sitter-html = "0.19.0"
tree-sitter-python = "0.20.4"
tree-sitter-javascript = "0.20.2"
tree-sitter-typescript = "0.20.3"
tree-sitter-go = "0.20.0"
tree-sitter-rust = "0.20.4"
tree-sitter-elixir = "0.1"

# SWC for enhanced TypeScript/JavaScript parsing
swc_ecma_parser = "33"
swc_ecma_ast = "20"
swc_common = "18"

# Async processing
async-trait = { workspace = true }
futures = { workspace = true }

# Data structures
indexmap = { workspace = true }
petgraph = { workspace = true }

# Performance
once_cell = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
tempfile = { workspace = true }

[[bench]]
name = "heuristics_benchmarks"
harness = false
