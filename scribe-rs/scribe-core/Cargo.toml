[package]
name = "scribe-core"
version = "0.5.0"
edition = "2021"
authors = ["Nathan Rice <nathan@sibylline.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sibyllinesoft/scribe"
homepage = "https://github.com/sibyllinesoft/scribe"
documentation = "https://docs.rs/scribe-core"
keywords = ["code-analysis", "ast", "repository", "documentation", "developer-tools"]
categories = ["development-tools", "text-processing", "parsing"]
description = "Core types and utilities for the Scribe code analysis library"

[dependencies]
# Core dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# File system and path handling
walkdir = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }

# String processing
memchr = { workspace = true }

# File type detection (libmagic-compatible)
tree_magic_mini = "3.0"

# Tokenization
tiktoken-rs = "0.7.0"

# Data structures
indexmap = { workspace = true }
dashmap = { workspace = true }

# Performance
once_cell = { workspace = true }
parking_lot = { workspace = true }

# Async traits
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }

aho-corasick = { workspace = true }

[features]
default = []

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
semver = "1.0"
tempfile = { workspace = true }
tokio-test = { workspace = true }

[[bench]]
name = "core_benchmarks"
harness = false
