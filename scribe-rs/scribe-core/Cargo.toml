[package]
name = "scribe-core"
version = "0.4.0"
edition = "2021"
authors = ["Nathan Rice <nathan@sibylline.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sibyllinesoft/scribe"
homepage = "https://github.com/sibyllinesoft/scribe"
documentation = "https://docs.rs/scribe-core"
keywords = ["code-analysis", "ast", "repository", "documentation", "developer-tools"]
categories = ["development-tools", "text-processing", "parsing"]
description = "Core types and utilities for the Scribe code analysis library"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

# File system and path handling
walkdir = "2.4"
ignore = "0.4"
globset = "0.4"

# String processing
memchr = "2.6"

# Tokenization
tiktoken-rs = "0.7.0"

# Data structures
indexmap = "2.0"
dashmap = "5.5"

# Performance
once_cell = "1.19"
parking_lot = "0.12"

# Async traits
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }

# Scaling optimizations
scribe-scaling = { path = "../scribe-scaling", version = "0.4.0", optional = true }
aho-corasick = "1.1"

[features]
default = []
scaling = ["scribe-scaling"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
semver = "1.0"
tempfile = "3.8"
tokio-test = "0.4"

[[bench]]
name = "core_benchmarks"
harness = false
