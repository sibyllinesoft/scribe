[package]
name = "scribe-scaling"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "High-performance scaling optimizations for large repositories"

[dependencies]
# Workspace dependencies
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rayon.workspace = true
thiserror.workspace = true
anyhow.workspace = true
futures.workspace = true
async-trait.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
once_cell.workspace = true

# Internal dependencies - minimal to avoid circular dependencies
# scribe-scaling is a foundational optimization layer that should be independent
scribe-core = { path = "../scribe-core" }

# Additional scaling-specific dependencies
lru = "0.12"
bincode = "1.3"
blake3 = "1.5"
memmap2 = "0.9"
flate2 = "1.0"
bytes = "1.5"
tracing = "0.1"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
sysinfo = "0.30"
uuid = { version = "1.6", features = ["v4"] }
num_cpus = "1.16"
walkdir = "2.4"
tree-sitter = "0.20"
regex = "1.10"
petgraph = "0.6"

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
tokio-test.workspace = true
tracing-subscriber = "0.3"

[[bench]]
name = "scaling_benchmarks"
harness = false
