[package]
name = "scribe-patterns"
version = "0.2.0"
edition = "2021"
authors = ["Nathan Rice <nathan@sibylline.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sibyllinesoft/scribe"
homepage = "https://github.com/sibyllinesoft/scribe"
documentation = "https://docs.rs/scribe-patterns"
keywords = ["code-analysis", "ast", "repository", "documentation", "developer-tools"]
categories = ["development-tools", "text-processing", "parsing"]
description = "Advanced pattern matching and search algorithms for Scribe"

[dependencies]
# Local dependencies
scribe-core = { version = "0.2.0", path = "../scribe-core" }
scribe-analysis = { version = "0.2.0", path = "../scribe-analysis" }

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"

# Pattern matching
regex = "1.10"
globset = "0.4"
ignore = "0.4"

# Logging
log = "0.4"

# String processing
memchr = "2.6"

# Async processing
async-trait = "0.1"
futures = "0.3"

# Data structures
indexmap = "2.0"

# Performance
once_cell = "1.19"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

