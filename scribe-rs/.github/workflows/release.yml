name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version from tag
      id: get_version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="${{ github.event.inputs.tag }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Version: ${VERSION}"
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        release_name: Release ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
        body: |
          Release ${{ steps.get_version.outputs.version }}

          ## What's Changed

          - See commit history for detailed changes

          ## Installation

          ### npm (Recommended)
          ```bash
          npm install -g @sibyllinesoft/scribe
          # or use directly with npx
          npx @sibyllinesoft/scribe --help
          ```

          ### From Source
          ```bash
          cargo install --git https://github.com/sibyllinesoft/scribe --tag ${{ steps.get_version.outputs.version }}
          ```

          ### Pre-built Binaries
          Download the appropriate binary for your platform from the assets below.

  build:
    name: Build Release Binaries
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: scribe-linux-x86_64
            npm_pkg: scribe-linux-x64

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: scribe-linux-x86_64-musl
            npm_pkg: ""

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: scribe-linux-aarch64
            npm_pkg: scribe-linux-arm64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: scribe-windows-x86_64.exe
            npm_pkg: scribe-win32-x64

          - target: x86_64-apple-darwin
            os: macos-latest
            name: scribe-macos-x86_64
            npm_pkg: scribe-darwin-x64

          - target: aarch64-apple-darwin
            os: macos-latest
            name: scribe-macos-aarch64
            npm_pkg: scribe-darwin-arm64
            
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        
    - name: Install musl tools (Linux musl only)
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Install cross-compilation tools (Linux ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
        echo "linker = \"aarch64-linux-gnu-gcc\"" >> ~/.cargo/config.toml
      
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target }}-release-cargo-
          
    - name: Build release binary
      run: |
        cargo build --release --target ${{ matrix.target }} --bin scribe
        
    - name: Strip binary (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        if [[ "${{ matrix.target }}" == *"musl"* ]]; then
          strip target/${{ matrix.target }}/release/scribe
        elif [[ "${{ runner.os }}" == "Linux" ]]; then
          strip target/${{ matrix.target }}/release/scribe
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          strip target/${{ matrix.target }}/release/scribe
        fi
        
    - name: Create archive (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ../../../${{ matrix.name }}.tar.gz scribe
        cd ../../..
        
    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd target/${{ matrix.target }}/release
        7z a ../../../${{ matrix.name }}.zip scribe.exe
        cd ../../..
        
    - name: Upload Release Asset (Unix)
      if: matrix.os != 'windows-latest'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./${{ matrix.name }}.tar.gz
        asset_name: ${{ matrix.name }}.tar.gz
        asset_content_type: application/gzip
        
    - name: Upload Release Asset (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./${{ matrix.name }}.zip
        asset_name: ${{ matrix.name }}.zip
        asset_content_type: application/zip

    - name: Upload binary for npm (Unix)
      if: matrix.npm_pkg != '' && matrix.os != 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.npm_pkg }}
        path: target/${{ matrix.target }}/release/scribe
        if-no-files-found: error

    - name: Upload binary for npm (Windows)
      if: matrix.npm_pkg != '' && matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.npm_pkg }}
        path: target/${{ matrix.target }}/release/scribe.exe
        if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: [create-release, build]
    runs-on: ubuntu-latest
    if: ${{ !contains(needs.create-release.outputs.version, '-') }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare npm packages
      run: |
        VERSION="${{ needs.create-release.outputs.version }}"
        VERSION="${VERSION#v}"  # Remove 'v' prefix

        echo "Preparing npm packages for version ${VERSION}"

        # Update version in all package.json files
        for pkg in scribe scribe-darwin-arm64 scribe-darwin-x64 scribe-linux-arm64 scribe-linux-x64 scribe-win32-x64; do
          if [ -f "npm/${pkg}/package.json" ]; then
            jq --arg v "$VERSION" '.version = $v' "npm/${pkg}/package.json" > tmp.json && mv tmp.json "npm/${pkg}/package.json"
            # Also update optionalDependencies versions for main package
            if [ "$pkg" = "scribe" ]; then
              jq --arg v "$VERSION" '.optionalDependencies |= with_entries(.value = $v)' "npm/${pkg}/package.json" > tmp.json && mv tmp.json "npm/${pkg}/package.json"
            fi
          fi
        done

        # Copy binaries to npm packages
        for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
          if [ -d "artifacts/scribe-${platform}" ]; then
            cp "artifacts/scribe-${platform}/scribe" "npm/scribe-${platform}/bin/scribe"
            chmod +x "npm/scribe-${platform}/bin/scribe"
            echo "Copied binary for ${platform}"
          fi
        done

        # Windows binary
        if [ -d "artifacts/scribe-win32-x64" ]; then
          cp "artifacts/scribe-win32-x64/scribe.exe" "npm/scribe-win32-x64/bin/scribe.exe"
          echo "Copied binary for win32-x64"
        fi

        # List contents for verification
        echo "Package contents:"
        for pkg in scribe-darwin-arm64 scribe-darwin-x64 scribe-linux-arm64 scribe-linux-x64 scribe-win32-x64; do
          echo "=== npm/${pkg} ==="
          ls -la "npm/${pkg}/bin/" || echo "No bin directory"
        done

    - name: Publish platform packages to npm
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        for pkg in scribe-darwin-arm64 scribe-darwin-x64 scribe-linux-arm64 scribe-linux-x64 scribe-win32-x64; do
          echo "Publishing @sibyllinesoft/${pkg}..."
          cd "npm/${pkg}"
          npm publish --access public || echo "Failed to publish ${pkg} (may already exist)"
          cd ../..
        done

    - name: Publish main package to npm
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        echo "Publishing @sibyllinesoft/scribe..."
        cd npm/scribe
        npm publish --access public
        cd ../..

  publish-crates:
    name: Publish to crates.io
    needs: [create-release, build]
    runs-on: ubuntu-latest
    if: ${{ !contains(needs.create-release.outputs.version, '-') }} # Only for non-prerelease
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ubuntu-publish-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ubuntu-publish-cargo-
          
    - name: Login to crates.io
      run: cargo login ${{ secrets.CRATES_IO_TOKEN }}
      
    - name: Verify package
      run: cargo package --workspace --allow-dirty
      
    - name: Publish workspace packages
      run: |
        # Publish workspace packages in dependency order
        # Core first
        cd scribe-core && cargo publish --allow-dirty
        cd ../scribe-analysis && cargo publish --allow-dirty
        cd ../scribe-graph && cargo publish --allow-dirty
        cd ../scribe-scanner && cargo publish --allow-dirty
        cd ../scribe-patterns && cargo publish --allow-dirty
        cd ../scribe-selection && cargo publish --allow-dirty
        cd ../scribe-scaling && cargo publish --allow-dirty
        cd ..
        
        # Wait for packages to be available
        sleep 60
        
        # Publish main package
        cargo publish --allow-dirty

  docker:
    name: Build and Push Docker Image
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: sibyllinesoft/scribe
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [create-release, build, publish-crates, publish-npm, docker]
    if: always()
    steps:
    - name: Release summary
      run: |
        echo "## Release ${{ needs.create-release.outputs.version }} Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| Release Created | ${{ needs.create-release.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Binaries Built | ${{ needs.build.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Crates.io Publish | ${{ needs.publish-crates.result == 'success' && '✅ Success' || (needs.publish-crates.result == 'skipped' && '⏭️ Skipped (prerelease)' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
        echo "| npm Publish | ${{ needs.publish-npm.result == 'success' && '✅ Success' || (needs.publish-npm.result == 'skipped' && '⏭️ Skipped (prerelease)' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker Image | ${{ needs.docker.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🚀 Release ${{ needs.create-release.outputs.version }} completed!" >> $GITHUB_STEP_SUMMARY