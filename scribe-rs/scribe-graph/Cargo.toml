[package]
name = "scribe-graph"
version = "0.5.0"
edition = "2021"
authors = ["Nathan Rice <nathan@sibylline.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sibyllinesoft/scribe"
homepage = "https://github.com/sibyllinesoft/scribe"
documentation = "https://docs.rs/scribe-graph"
keywords = ["code-analysis", "ast", "repository", "documentation", "developer-tools"]
categories = ["development-tools", "text-processing", "parsing"]
description = "Graph-based code representation and analysis for Scribe"

[dependencies]
# Local dependencies
scribe-core = { version = "0.5.0", path = "../scribe-core" }
scribe-analysis = { version = "0.5.0", path = "../scribe-analysis" }

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"

# Graph processing
petgraph = "0.6"

# Async processing
async-trait = "0.1"
futures = "0.3"

# Data structures
indexmap = "2.0"
dashmap = "5.5"

# Performance
once_cell = "1.19"
parking_lot = "0.12"

# Time handling for timestamps
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

