name: Scribe CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    # Run nightly builds to catch drift
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ================================
  # RUST CORE TESTING
  # ================================
  rust-core:
    name: Rust Core - Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scribe-rs

      - name: Check Rust formatting
        run: |
          cd scribe-rs
          cargo fmt --all -- --check

      - name: Run Clippy lints
        run: |
          cd scribe-rs
          cargo clippy --workspace --all-features --lib --bins --tests -- -D warnings

      - name: Build all workspace crates
        run: |
          cd scribe-rs
          cargo build --workspace --all-features

      - name: Run Rust tests
        run: |
          cd scribe-rs
          cargo test --workspace --all-features --lib --bins

      - name: Build scribe binary
        run: |
          cd scribe-rs
          cargo build -p scribe-analyzer --bin scribe --release

      - name: Test CLI functionality
        run: |
          cd scribe-rs
          ./target/release/scribe --version
          ./target/release/scribe --help

      - name: Upload Rust artifacts
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-artifacts
          path: |
            scribe-rs/target/release/scribe
          retention-days: 7

  # ================================
  # E2E TEST INFRASTRUCTURE
  # ================================
  e2e-tests:
    name: E2E Tests - Library & CLI
    runs-on: ubuntu-latest
    needs: rust-core
    timeout-minutes: 45

    steps:
      - name: Skip e2e tests in act
        if: ${{ env.ACT == 'true' }}
        run: echo "Skipping e2e-tests job for local act run"

      - name: Checkout code
        if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: ${{ env.ACT != 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        if: ${{ env.ACT != 'true' }}
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Rust dependencies
        if: ${{ env.ACT != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scribe-rs

      - name: Download Rust artifacts
        if: ${{ env.ACT != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: rust-artifacts
          path: scribe-rs/target/release/

      - name: Make binary executable
        if: ${{ env.ACT != 'true' }}
        run: chmod +x scribe-rs/target/release/scribe

      - name: Setup e2e test environment
        if: ${{ env.ACT != 'true' }}
        run: |
          cd tests
          make check-deps
          make deps

      - name: Run library unit tests
        if: ${{ env.ACT != 'true' }}
        run: |
          cd tests
          make test-lib

      - name: Build Scribe for e2e tests
        if: ${{ env.ACT != 'true' }}
        run: |
          cd tests
          make build

      - name: Run CLI parameter tests
        if: ${{ env.ACT != 'true' }}
        run: |
          cd tests
          make test-cli

      - name: Upload e2e test results
        if: ${{ env.ACT != 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            tests/artifacts/
            tests/logs/
          retention-days: 7

  # ================================
  # WEB UI E2E TESTS (with Playwright)
  # ================================
  webui-e2e:
    name: Web UI E2E Tests
    runs-on: ubuntu-latest
    needs: rust-core
    timeout-minutes: 60
    
    steps:
      - name: Skip web UI tests in act
        if: ${{ env.ACT == 'true' }}
        run: echo "Skipping webui-e2e job for local act run"

      - name: Checkout code
        if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: ${{ env.ACT != 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        if: ${{ env.ACT != 'true' }}
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Rust dependencies
        if: ${{ env.ACT != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scribe-rs

      - name: Download Rust artifacts
        if: ${{ env.ACT != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: rust-artifacts
          path: scribe-rs/target/release/

      - name: Make binary executable
        if: ${{ env.ACT != 'true' }}
        run: chmod +x scribe-rs/target/release/scribe

      - name: Setup test environment
        if: ${{ env.ACT != 'true' }}
        run: |
          cd tests
          make check-deps
          make deps

      - name: Install Playwright browsers
        if: ${{ env.ACT != 'true' }}
        run: |
          cd tests
          bun run playwright:install

      - name: Build Scribe for web UI tests
        if: ${{ env.ACT != 'true' }}
        run: |
          cd tests
          make build

      - name: Run Web UI tests
        if: ${{ env.ACT != 'true' }}
        run: |
          cd tests
          make test-webui
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ env.ACT != 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7


  # ================================
  # INTEGRATION & SMOKE TESTS
  # ================================
  integration:
    name: Integration & Smoke Tests
    runs-on: ubuntu-latest
    needs: [rust-core, e2e-tests]
    timeout-minutes: 30
    
    steps:
      - name: Skip integration tests in act
        if: ${{ env.ACT == 'true' }}
        run: echo "Skipping integration job for local act run"

      - name: Checkout code
        if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: ${{ env.ACT != 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        if: ${{ env.ACT != 'true' }}
        uses: oven-sh/setup-bun@v1

      - name: Cache Rust dependencies
        if: ${{ env.ACT != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scribe-rs

      - name: Download Rust artifacts
        if: ${{ env.ACT != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: rust-artifacts
          path: scribe-rs/target/release/

      - name: Make binary executable
        if: ${{ env.ACT != 'true' }}
        run: chmod +x scribe-rs/target/release/scribe

      - name: Smoke test - Scribe on itself
        if: ${{ env.ACT != 'true' }}
        run: |
          cd scribe-rs
          # Test Scribe analyzing its own codebase
          ./target/release/scribe . --token-budget 10000 --no-browser --port 9999 &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 10
          
          # Check if server is responding
          curl -f http://localhost:9999/ || echo "Server not responding"
          
          # Clean shutdown
          kill $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Test different CLI configurations
        if: ${{ env.ACT != 'true' }}
        run: |
          cd scribe-rs
          # Test various CLI parameter combinations
          ./target/release/scribe . --token-budget 5000 --max-file-size 100000 --no-exclude-tests --no-browser --port 9998 &
          SERVER_PID=$!
          sleep 5
          kill $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Performance baseline test
        if: ${{ env.ACT != 'true' }}
        run: |
          cd scribe-rs
          # Quick performance test
          time ./target/release/scribe . --token-budget 1000 --no-browser --port 9997 &
          SERVER_PID=$!
          sleep 3
          kill $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true

  # ================================
  # SECURITY & QUALITY CHECKS
  # ================================
  security:
    name: Security & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scribe-rs

      - name: Run cargo audit
        run: |
          cargo install cargo-audit
          cd scribe-rs
          cargo audit

      - name: Run cargo deny
        run: |
          cargo install cargo-deny
          cd scribe-rs
          cargo deny check

      - name: Check for common security issues
        run: |
          cd scribe-rs
          # Check for hardcoded secrets (basic check)
          if grep -r "password\|secret\|key\|token" --include="*.rs" . | grep -v "// " | grep -v "test"; then
            echo "Warning: Potential hardcoded secrets found"
          fi

      - name: Validate dependencies
        run: |
          cd scribe-rs
          cargo tree --duplicates

  # ================================
  # RELEASE & DOCUMENTATION
  # ================================
  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest
    needs: [rust-core, e2e-tests, webui-e2e, integration, security]
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    timeout-minutes: 15

    steps:
      - name: Skip release checks in act
        if: ${{ env.ACT == 'true' }}
        run: echo "Skipping release-check job for local act run"

      - name: Checkout code
        if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: ${{ env.ACT != 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Check release build
        if: ${{ env.ACT != 'true' }}
        run: |
          cd scribe-rs
          cargo build --release --workspace

      - name: Validate documentation
        if: ${{ env.ACT != 'true' }}
        run: |
          cd scribe-rs
          cargo doc --workspace --all-features --no-deps

      - name: Check version consistency
        if: ${{ env.ACT != 'true' }}
        run: |
          cd scribe-rs
          # Ensure all workspace crates have the same version
          EXPECTED_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Expected version: $EXPECTED_VERSION"
          
          for crate in scribe-*; do
            if [ -f "$crate/Cargo.toml" ]; then
              CRATE_VERSION=$(grep '^version.workspace = true' "$crate/Cargo.toml" || grep '^version = ' "$crate/Cargo.toml" | cut -d'"' -f2)
              if [ -n "$CRATE_VERSION" ] && [ "$CRATE_VERSION" != "true" ] && [ "$CRATE_VERSION" != "$EXPECTED_VERSION" ]; then
                echo "Version mismatch in $crate: $CRATE_VERSION"
                exit 1
              fi
            fi
          done

      - name: Generate release summary
        if: ${{ env.ACT != 'true' }}
        run: |
          echo "# Scribe Release Summary" > release-summary.md
          echo "" >> release-summary.md
          echo "**Version:** $(cd scribe-rs && grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)" >> release-summary.md
          echo "**Commit:** ${{ github.sha }}" >> release-summary.md
          echo "**Date:** $(date -Iseconds)" >> release-summary.md
          echo "" >> release-summary.md
          echo "## Test Results" >> release-summary.md
          echo "- ✅ Rust core tests passed" >> release-summary.md
          echo "- ✅ E2E tests passed" >> release-summary.md
          echo "- ✅ Web UI tests passed" >> release-summary.md
          echo "- ✅ Integration tests passed" >> release-summary.md
          echo "- ✅ Security checks passed" >> release-summary.md

      - name: Upload release artifacts
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: release-summary.md
          retention-days: 30

  # ================================
  # FINAL STATUS SUMMARY
  # ================================
  status:
    name: CI Status Summary
    runs-on: ubuntu-latest
    needs: [rust-core, e2e-tests, webui-e2e, integration, security]
    if: always()

    steps:
      - name: Check overall status
        run: |
          echo "==================================="
          echo "Scribe CI/CD Pipeline Summary"
          echo "==================================="
          rust_core="${{ needs.rust-core.result }}"
          e2e="${{ needs.e2e-tests.result }}"
          webui="${{ needs.webui-e2e.result }}"
          integration="${{ needs.integration.result }}"
          security="${{ needs.security.result }}"

          echo "Rust Core: ${rust_core}"
          echo "E2E Tests: ${e2e}"
          echo "Web UI Tests: ${webui}"
          echo "Integration: ${integration}"
          echo "Security: ${security}"
          echo "==================================="
          
          treat_as_success() {
            local label="$1"
            local result="$2"

            case "$result" in
              success)
                return 0
                ;;
              skipped)
                if [[ "${ACT:-}" == "true" ]]; then
                  echo "ℹ️  ${label} skipped under act run; treating as success."
                  return 0
                fi
                ;;
              neutral)
                if [[ "${ACT:-}" == "true" ]]; then
                  echo "ℹ️  ${label} reported neutral; treating as success for act."
                  return 0
                fi
                ;;
            esac

            echo "⚠️  ${label} reported status '${result}'."
            return 1
          }

          overall_ok=true

          treat_as_success "Rust Core" "$rust_core" || overall_ok=false
          treat_as_success "E2E Tests" "$e2e" || overall_ok=false
          treat_as_success "Web UI Tests" "$webui" || overall_ok=false
          treat_as_success "Integration" "$integration" || overall_ok=false
          treat_as_success "Security" "$security" || overall_ok=false

          if $overall_ok; then
            echo "🎉 Overall Status: SUCCESS"
            if [[ "${ACT:-}" == "true" ]]; then
              echo "All mandatory jobs passed; optional jobs skipped locally."
            else
              echo "All critical tests passed!"
            fi
            exit 0
          else
            echo "❌ Overall Status: FAILURE"
            echo "Some tests failed - review the logs above"
            exit 1
          fi
