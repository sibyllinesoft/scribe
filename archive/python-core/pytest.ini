[tool:pytest]
# Pytest configuration for Scribe

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --strict-markers --tb=short

# Minimum version
minversion = 6.0

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    network: marks tests that require network access
    platform_specific: marks tests that are platform specific

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*imp module.*:DeprecationWarning

# Coverage options (if coverage is installed)
# Run with: pytest --cov=scribe --cov-report=html
# addopts = --cov=scribe --cov-report=term-missing --cov-report=html --cov-fail-under=85